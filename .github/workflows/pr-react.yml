name: React Checks

on:
  pull_request:
    paths:
      - 'packages/react/**'
      - 'packages/shared/**'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: pr-react-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react-check:
    name: React Registry Build, Verify & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install

      - name: Build React registry
        run: bun run build:react

      - name: Verify React registry
        run: bun run verify:react

      - name: Test React
        run: bun run test:react
